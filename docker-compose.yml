services:
  pgsqldb:
    image: camptocamp/postgres:13-postgis-3
    restart: always
    networks:
      - oim-internal
    # Port PostgreSQL sur l'hôte (par défaut: 5433 pour éviter les conflits)
    # Pour changer le port, créez un fichier .env avec: POSTGRES_PORT=5434
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    environment:
      - POSTGRES_DB=pdm
      - POSTGRES_PASSWORD=pgpassword
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pdm"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  pdm:
    image: pdm/server:latest
    restart: always
    depends_on:
      pgsqldb:
        condition: service_healthy
    network_mode: host
    # Keep connection to database via host network
    # DB_URL will use pgsqldb hostname which resolves via /etc/hosts or docker network
    volumes:
      - pdm-data:/data/files/pdm
      - ./projects:/opt/pdm/projects:ro
      - ./website:/opt/pdm/website:ro
      - ./db:/opt/pdm/db
      - ./package.json:/opt/pdm/package.json:ro
      - ./dockerfiles/docker-entrypoint.sh:/opt/pdm/docker-entrypoint.sh:ro
      - ./lib:/opt/pdm/lib:ro
      - ./config.json:/opt/pdm/config.json:ro
    environment:
      - DB_URL=postgres://postgres:pgpassword@localhost:${POSTGRES_PORT:-5433}/pdm
    dns:
      - 8.8.8.8
      - 8.8.4.4
    dns_search: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/bash", "-c"]
    command: ["cd /opt/pdm && npm run start"]

  pdm-tileserv:
    image: pramsey/pg_tileserv:latest
    restart: always
    depends_on:
      pgsqldb:
        condition: service_healthy
    networks:
      - oim-internal
    ports:
      - "7800:7800"
    environment:
      - DATABASE_URL=postgres://postgres:pgpassword@pgsqldb:5432/pdm

volumes:
  db-data:
  pdm-data:

networks:
  oim-internal:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"